<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EsTuMap – Mapa del Campus</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy:   #0a1628;
    --navy2:  #0d1f3c;
    --teal:   #1a7a8a;
    --cyan:   #2cb5c8;
    --orange: #f7941d;
    --red:    #e8433a;
    --white:  #ffffff;
  }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--navy);
    color: var(--white);
    height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    overflow: hidden;
  }
  .header {
    background: var(--navy2);
    padding: 14px 16px 10px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: 0; right: -30px;
    width: 220px; height: 70px;
    background: var(--teal);
    border-radius: 60% 60% 0 0 / 80% 80% 0 0;
    opacity: 0.35;
    transform: rotate(-8deg);
  }
  .banner-img { height: 60px; position: relative; z-index: 1; }
  .campus-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--navy2);
    margin: 10px 14px;
    border-radius: 14px;
    padding: 11px 16px;
    border: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .campus-bar .pin-icon { font-size: 1.3rem; }
  .campus-bar-text { flex: 1; }
  .campus-bar-text strong { display: block; font-size: 0.9rem; font-weight: 800; }
  .campus-bar-text span { font-size: 0.73rem; color: var(--cyan); font-weight: 600; }
  .map-wrapper { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #map { flex: 1; }
  .map-zoom {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 2px; z-index: 500;
  }
  .map-zoom button {
    width: 40px; height: 40px;
    background: var(--navy2); border: none;
    color: var(--white); font-size: 1.3rem;
    cursor: pointer; font-weight: 700;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .map-zoom button:first-child { border-radius: 8px 8px 4px 4px; }
  .map-zoom button:last-child  { border-radius: 4px 4px 8px 8px; }
  .map-center-btn {
    position: absolute; left: 14px; bottom: 14px;
    width: 40px; height: 40px;
    background: var(--navy2); border: none; color: var(--cyan);
    font-size: 1.2rem; cursor: pointer; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.4); z-index: 500;
    display: flex; align-items: center; justify-content: center;
  }
  .map-legend {
    background: var(--navy2);
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 9px 14px;
    display: flex; flex-wrap: wrap; gap: 7px 13px; flex-shrink: 0;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.67rem; color: #8aa3c0; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3); flex-shrink: 0; }
  .footer-wave {
    flex-shrink: 0; background: var(--navy2);
    overflow: hidden; height: 44px; position: relative;
  }
  .footer-wave::before {
    content: '';
    position: absolute; bottom: 0; left: -10%;
    width: 120%; height: 44px;
    background: linear-gradient(90deg, var(--teal) 0%, var(--orange) 50%, var(--red) 100%);
    border-radius: 50% 50% 0 0 / 60% 60% 0 0; opacity: 0.45;
  }
  .footer-dot {
    position: absolute; right: 14px; bottom: 8px;
    width: 10px; height: 10px;
    background: var(--cyan); border-radius: 50%; z-index: 2;
  }
  .leaflet-popup-content-wrapper {
    background: var(--navy2); color: var(--white);
    border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.5);
  }
  .leaflet-popup-tip { background: var(--navy2); }
  .popup-inner h3 { font-size: 0.88rem; font-weight: 800; color: var(--cyan); margin-bottom: 4px; }
  .popup-inner p  { font-size: 0.74rem; color: #ccc; }
  .popup-inner a  {
    display: inline-block; margin-top: 8px;
    background: var(--orange); color: var(--navy);
    font-weight: 800; font-size: 0.72rem;
    padding: 5px 12px; border-radius: 20px; text-decoration: none;
  }
</style>
</head>

<div class="campus-bar">
  <span class="pin-icon">📍</span>
  <div class="campus-bar-text">
    <strong>Universidad de La Guajira</strong>
    <span>Campus Principal · Riohacha</span>
  </div>
</div>

<div class="map-wrapper">
  <div id="map"></div>
  <div class="map-zoom">
    <button onclick="map.zoomIn()">+</button>
    <button onclick="map.zoomOut()">−</button>
  </div>
  <button class="map-center-btn" onclick="map.setView([11.5138,-72.8697],18)" title="Centrar">🎯</button>
</div>



<div class="footer-wave"><div class="footer-dot"></div></div>

<script>
const LAT = 11.5140459, LNG = -72.8691971;
const campusBounds = L.latLngBounds([11.5108,-72.8730],[11.5172,-72.8658]);
const map = L.map('map', {
  zoomControl: false, attributionControl: false,
  maxBounds: campusBounds, maxBoundsViscosity: 0.85,
  minZoom: 17, maxZoom: 19
}).setView([11.5138, -72.8697], 18);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

const pinIcon = L.divIcon({
  html: `<div style="width:36px;height:44px;position:relative;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))">
    <svg viewBox="0 0 36 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M18 0C8 0 0 8.1 0 18.2c0 13.6 18 25.8 18 25.8S36 31.8 36 18.2C36 8.1 28 0 18 0z" fill="#f7941d"/>
      <circle cx="18" cy="18" r="7" fill="white"/><circle cx="18" cy="18" r="4" fill="#f7941d"/>
    </svg></div>`,
  iconSize: [36,52], iconAnchor: [18,52], popupAnchor: [0,-54]
});

// Icono azul para la ubicación del usuario
const userIcon = L.divIcon({
  html: `<div style="width:28px;height:28px;position:relative;">
    <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="14" cy="14" r="12" fill="#2cb5c8" stroke="white" stroke-width="3"/>
      <circle cx="14" cy="14" r="5" fill="white"/>
    </svg></div>`,
  iconSize: [28,28], iconAnchor: [14,14], popupAnchor: [0,-16]
});

// Marcador fijo del campus
const campusMarker = L.marker([LAT,LNG], {icon: pinIcon}).addTo(map);
campusMarker.bindPopup(`<div class="popup-inner">
  <h3>🏛️ Universidad de La Guajira</h3>
  <p>Campus Principal · Riohacha</p>
</div>`, {maxWidth:200}).openPopup();

// Marcador del usuario (se mueve con el GPS)
let userMarker = null;
let firstLocate = true;

function onLocationFound(e) {
  const latlng = e.latlng;
  // Solo mover si está dentro del campus
  if (campusBounds.contains(latlng)) {
    if (userMarker) {
      userMarker.setLatLng(latlng);
    } else {
      userMarker = L.marker(latlng, {icon: userIcon}).addTo(map);
      userMarker.bindPopup('<div class="popup-inner"><h3>📍 Tu ubicación</h3></div>', {maxWidth:160});
    }
    if (firstLocate) {
      map.setView(latlng, 18);
      firstLocate = false;
    }
  }
}

function onLocationError(e) {
  console.warn('GPS no disponible:', e.message);
}

map.on('locationfound', onLocationFound);
map.on('locationerror', onLocationError);

// Iniciar seguimiento continuo
map.locate({ watch: true, enableHighAccuracy: true, maximumAge: 5000 });


</script>
